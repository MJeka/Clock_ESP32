[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_archive = no

; Добавляем запуск скрипта для чтения версии
extra_scripts = pre:read_version.py

build_flags = 
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
    -D USER_SETUP_LOADED
    -D ST7789_DRIVER
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=27
    -D TFT_RST=33
    -D TFT_BL=22
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=80000000

lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@^7.0.4
    ; GyverLibs/AutoOTA 

board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

; Ваши настройки локального OTA остаются без изменений
upload_protocol = espota
upload_port = Clock-ESP32.local
upload_flags = 
    --auth=jeka